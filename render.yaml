services:
  - type: web
    name: po-rfq-resolver
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn PO_RFQFolderID_Script:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GLIDE_API_TOKEN
        sync: false
      - key: POWER_AUTOMATE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.2
